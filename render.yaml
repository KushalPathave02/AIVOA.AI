services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: pharmaroot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaroot-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads

  # ---------- Frontend (React static site) ----------
  - type: web
    name: pharmaroot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # TODO: after first deploy, set this to your backend URL, e.g. https://pharmaroot-api.onrender.com
      - key: VITE_API_URL
        value: https://pharmaroot-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pharmaroot-db
    plan: free
